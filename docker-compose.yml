# Local development database only. Production uses Neon.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cloudvault
      POSTGRES_PASSWORD: cloudvault
      POSTGRES_DB: cloudvault
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # set POSTGRES_PORT if 5432 is taken locally
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudvault"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
